[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptlab"
version = "0.1.0"
description = "Pilot scaffold for pre-response factual-risk forecasting and selective epistemic updating"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MickyykciM" }]
dependencies = []

[project.optional-dependencies]
model = [
  "accelerate>=1.2",
  "torch>=2.4",
  "transformers>=4.48",
]
analysis = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "statsmodels>=0.14",
]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
adaptlab = "adaptlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
